<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1222">
<title>Komunikasi Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: night-time adventure map. Single dark world on purpose (a game screen), every colour set explicitly.
   Gold = reward, emerald = correct, ruby = damage, sky = information, violet = rare. */
:root{
  color-scheme:dark;
  --night:#0e1222; --night2:#151a2e; --panel:#1b2140; --panel2:#232a50; --line:#33406e;
  --ink:#eef0ff; --muted:#a3abd6; --dim:#6e77a8;
  --gold:#ffd166; --gold2:#f4a73b; --emerald:#45d48a; --ruby:#ff5c7a; --sky:#5cc8ff; --violet:#b58cff; --epic:#ff9f43;
  --f-pixel:"Pixelify Sans","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Nunito","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  background-image:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 36%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 88% 52%,#ffffff44 50%,transparent 51%),radial-gradient(1px 1px at 22% 78%,#ffffff33 50%,transparent 51%),linear-gradient(180deg,#0e1222 0%,#141a33 60%,#0e1222 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pix{font-family:var(--f-pixel);letter-spacing:.02em}
img.sprite{image-rendering:pixelated;image-rendering:crisp-edges}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--night) 70%,transparent);padding-block:10px 14px}
.hud .row{display:flex;align-items:center;gap:12px}
.hud .ava{width:44px;height:44px;border-radius:10px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.hud .ava img{width:36px;height:36px}
.hud .who{min-width:0;flex:1}
.hud .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .title{font-size:12px;color:var(--muted)}
.xpbar{height:8px;background:var(--panel);border-radius:6px;overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .5s}
.lvl{font-family:var(--f-pixel);font-size:22px;color:var(--gold);line-height:1;text-align:center}
.lvl small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-body)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* nav */
.nav{position:sticky;bottom:0;z-index:20;background:var(--night2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--gold);background:var(--panel)}
main{flex:1;padding-block:4px 24px}

/* map */
.region{margin-bottom:26px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.rhead h2{font-family:var(--f-pixel);font-size:22px;margin:0;color:var(--gold)}
.rhead span{color:var(--muted);font-size:13px}
.trail{position:relative}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:128px}
.node .disc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:3px solid var(--line);box-shadow:0 6px 0 #0008;position:relative;transition:transform .15s}
.node:hover .disc{transform:translateY(-3px)}
.node .disc img{width:48px;height:48px}
.node.open .disc{border-color:var(--sky)}
.node.cleared .disc{border-color:var(--gold)}
.node.locked{cursor:not-allowed}
.node.locked .disc{filter:grayscale(1) brightness(.55)}
.node .lock{position:absolute;right:-4px;bottom:-4px;background:var(--night2);border:2px solid var(--line);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.node .lock svg{width:12px;height:12px}
.node .label{font-size:12px;font-weight:800;text-align:center;line-height:1.25;background:#0e1222cc;border-radius:6px;padding:2px 6px}
.node .code{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.stars{display:flex;gap:2px}
.stars svg{width:14px;height:14px}
.node.next .disc::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--sky);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mring{font-size:11px;color:var(--emerald);font-weight:800}

/* panels, modals */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.modal{position:fixed;inset:0;z-index:80;background:#05070fcc;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal .box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 60px #000a;animation:pop .25s ease-out;max-height:100%;overflow-y:auto}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal h3{font-family:var(--f-pixel);font-size:24px;margin:0 0 6px;color:var(--gold);text-wrap:balance}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--gold);color:#2a1a00;box-shadow:0 4px 0 var(--gold2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold2)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0d1126;border:1px solid var(--line)}
.btn.danger{background:var(--ruby);color:#2a0010;box-shadow:0 4px 0 #a3243f}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.facts-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.facts-list div{background:var(--night2);border-radius:10px;padding:8px 10px}
.facts-list b{display:block}
.facts-list .ok{color:var(--emerald)}
input[type=email],input[type=password]{width:100%;background:var(--night2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:16px;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px;font-weight:800;color:var(--muted)}
.tabs button[aria-pressed="true"]{color:#2a1a00;background:var(--gold);border-color:var(--gold)}
input[type=text]{width:100%;background:var(--night2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:16px;padding:12px}

/* battle */
#battle{position:fixed;inset:0;z-index:50;background:var(--night);overflow-y:auto;display:flex;flex-direction:column}
#battle[hidden]{display:none}
.bwrap{max-width:760px;width:100%;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;flex:1}
.btop{display:flex;align-items:center;gap:10px}
.btop .lt{flex:1;min-width:0}
.btop .lt b{display:block;font-family:var(--f-pixel);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.25;filter:grayscale(1)}
.stage{position:relative;height:170px;border-radius:16px;background:radial-gradient(120% 90% at 50% 100%,#2a3463 0%,#151a2e 70%);border:1px solid var(--line);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px}
.stage::after{content:"";position:absolute;left:10%;right:10%;bottom:12px;height:14px;border-radius:50%;background:#0006;filter:blur(2px)}
.monster{width:112px;height:112px;position:relative;z-index:1;animation:bob 1.8s ease-in-out infinite}
.monster.hit{animation:hit .35s}
.monster.dead{animation:die .7s forwards}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hit{0%{filter:brightness(4)}30%{transform:translateX(8px)}60%{transform:translateX(-6px)}100%{filter:none}}
@keyframes die{to{transform:scale(.2) rotate(30deg);opacity:0;filter:brightness(3)}}
.mhp{position:absolute;top:10px;left:12px;right:12px;z-index:2}
.mhp .nm{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.mhp .bar{height:12px;background:#0b0e1d;border-radius:8px;border:1px solid var(--line);overflow:hidden;margin-top:3px}
.mhp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ruby),#ff8fa3);transition:width .35s}
.combo{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--f-pixel);text-align:right;line-height:1}
.combo b{font-size:30px;display:block}
.combo span{font-size:12px;color:var(--muted)}
.combo.t1 b{color:var(--sky)} .combo.t2 b{color:var(--gold)} .combo.t3 b{color:var(--epic);text-shadow:0 0 12px var(--epic)}
.flags{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;gap:4px;flex-wrap:wrap;max-width:50%}
.flags .chip{font-size:11px;padding:2px 8px}
.timer{height:6px;background:#0b0e1d;border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sky);width:100%}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qtag{font-size:12px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtag .chip{text-transform:none;letter-spacing:0}
.qp{font-size:17px;font-weight:700;text-wrap:pretty}
.qp em{color:var(--gold);font-style:normal}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--night2);border:2px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;transition:transform .08s,border-color .15s}
.opt:hover:not([disabled]){border-color:var(--sky);transform:translateY(-1px)}
.opt .k{font-family:var(--f-pixel);color:var(--muted);flex:none;width:18px}
.opt.right{border-color:var(--emerald);background:#123a2a}
.opt.wrong{border-color:var(--ruby);background:#3a1220}
.opt.gone{opacity:.25}
.opt[disabled]{cursor:default}
.typebox{display:flex;gap:8px}
.typebox input{flex:1}
.hintline{font-family:var(--f-pixel);color:var(--gold);letter-spacing:.15em}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{text-align:left;background:var(--night2);border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:14px;min-height:48px}
.mi.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffd16644}
.mi.done{border-color:var(--emerald);opacity:.55}
.mi.bad{animation:shake .35s}
.mi.over{border-color:var(--sky)}
.order{display:flex;flex-wrap:wrap;gap:8px}
.order .mi{min-height:auto}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.seq span{background:var(--emerald);color:#04210f;border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:pop .2s}
.fb.ok{background:#123a2a;border:1px solid var(--emerald)}
.fb.no{background:#3a1220;border:1px solid var(--ruby)}
.fb .t{font-weight:800}
.fb .f{font-family:var(--f-pixel);font-size:17px;color:var(--gold)}
.tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pcard{flex:none;width:86px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;text-align:center;line-height:1.2}
.pcard svg{width:28px;height:28px}
.pcard .kb{font-family:var(--f-pixel);color:var(--dim);font-size:10px}
.pcard.rare{border-color:var(--violet)} .pcard.epic{border-color:var(--epic)}
.pcard[disabled]{opacity:.35;cursor:not-allowed}
.trayhint{font-size:12px;color:var(--dim)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:70;box-shadow:inset 0 0 120px 40px #ff2a4a;opacity:0;transition:opacity .2s}
.vignette.on{opacity:.55}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.float{position:fixed;z-index:91;pointer-events:none;font-family:var(--f-pixel);font-size:26px;font-weight:700;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 #000}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:95;background:var(--panel2);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:800;max-width:min(92vw,460px);box-shadow:0 10px 30px #000a;animation:toast 2.6s forwards;text-align:center}
@keyframes toast{0%{transform:translate(-50%,-20px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{opacity:0}}

/* draft cards */
.draft{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
.dcard{position:relative;aspect-ratio:3/4.2;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .6s;max-width:100%}
.dcard.flip{transform:rotateY(180deg)}
.dcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border:2px solid var(--line)}
.dcard .back{background:repeating-linear-gradient(45deg,#232a50 0 10px,#1b2140 10px 20px);}
.dcard .back svg{width:40px;height:40px}
.dcard .front{transform:rotateY(180deg);background:var(--panel2)}
.dcard .front svg{width:40px;height:40px}
.dcard .front b{font-size:13px;line-height:1.2}
.dcard .front small{font-size:11px;color:var(--muted);line-height:1.3}
.dcard .front .rar{font-family:var(--f-pixel);font-size:11px}
.dcard.common .front{border-color:var(--sky)} .dcard.rare .front{border-color:var(--violet);box-shadow:0 0 18px #b58cff55} .dcard.epic .front{border-color:var(--epic);box-shadow:0 0 22px #ff9f4377}
.bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.bigstars svg{width:46px;height:46px;animation:pop .4s backwards}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.stat3 div{background:var(--night2);border-radius:10px;padding:8px}
.stat3 b{display:block;font-family:var(--f-pixel);font-size:22px;color:var(--gold)}
.stat3 span{font-size:12px;color:var(--muted)}

/* album, badges, rank */
.sec-title{font-family:var(--f-pixel);font-size:22px;color:var(--gold);margin:6px 0 4px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.acard{position:relative;min-height:140px;border:0;padding:0;background:none;perspective:700px}
.acard .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.acard.flip .in{transform:rotateY(180deg)}
.acard .fc{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;padding:10px;display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);text-align:left;overflow:hidden}
.acard .fr{background:linear-gradient(160deg,var(--panel2),var(--panel))}
.acard .bk{transform:rotateY(180deg);background:var(--night2);font-size:12px;line-height:1.35;overflow-y:auto}
.acard.got .fr{border-color:var(--gold)}
.acard .fr b{font-size:14px;line-height:1.25}
.acard .fr .lv{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.acard.locked .fr{filter:saturate(.2);opacity:.7}
.dots{display:flex;gap:4px;margin-top:auto}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--emerald)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.badge svg{width:46px;height:46px}
.badge.got{border-color:var(--gold)}
.badge.no{opacity:.45}
.badge b{font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:36px 40px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rrow.me{border-color:var(--gold);background:var(--panel2)}
.rrow .n{font-family:var(--f-pixel);font-size:20px;text-align:center;color:var(--muted)}
.rrow:nth-child(1) .n{color:var(--gold)} .rrow:nth-child(2) .n{color:#d6dcf5} .rrow:nth-child(3) .n{color:#e3a36c}
.rrow img{width:36px;height:36px}
.rrow .nm{min-width:0}
.rrow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm span{font-size:12px;color:var(--muted)}
.rrow .xp{font-family:var(--f-pixel);color:var(--gold);font-size:18px;text-align:right}
.set{display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.toggle input{width:22px;height:22px;accent-color:var(--gold)}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.avatars button{background:var(--night2);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.avatars button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.avatars img{width:56px;height:56px}
kbd{font-family:var(--f-pixel);background:var(--night2);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:12px}
.tut{display:flex;gap:12px;align-items:flex-start;background:var(--night2);border-radius:12px;padding:10px}
.tut svg{width:30px;height:30px;flex:none}
@media (max-width:520px){
  .node{width:104px}.node .disc{width:58px;height:58px}.node .disc img{width:40px;height:40px}
  .match{grid-template-columns:1fr}
  .stage{height:150px}.monster{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>


<div id="app">
  <header class="hud"><div class="wrap" id="hud"></div></header>
  <main><div class="wrap" id="view"></div></main>

const MEL = [69, 72, 76, 72, 74, 72, 69, 67, 69, 72, 76, 79, 76, 74, 72, 74, 69, 72, 76, 72, 74, 76, 79, 81, 79, 76, 74, 72, 74, 72, 69, null];
const BASS = [45, 45, 48, 48, 43, 43, 45, 45];
function bgm(on) {
  clearInterval(bgmTimer); bgmTimer = null; if (!on) return; const a = audio(); if (!a) return;
  let step = 0; const hz = n => 440 * Math.pow(2, (n - 69) / 12);

const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], fxRun = false;

function burst(x, y, colors, n = 24, spd = 5) {

function claudeAdapter(db, id) {

    writeSave(k, state, xp) { return db.doc('data/users/' + id + '/save').set({ state, xp, at: Date.now() }); },

/* ================= BATTLE ================= */
let B = null;
const MODE_ZH = { mcqF: '选择题', mcqH: '反向选择', type: '默写', match: '配对', kk: '个案找 KK', gF: '归类', gH: '反向归类', order: '排序技能' };
const caseOf = fid => { const L = LEVEL_OF[fid]; if (!L.cases) return null; for (const c of L.cases) { const it = c.items.find(i => i.fid === fid); if (it) return { c, it }; } return null; };
function modesFor(fid) { const L = LEVEL_OF[fid]; if (L.groupMode) return ['gF', 'gH']; const m = ['mcqF', 'mcqH', 'type', 'match']; if (caseOf(fid)) m.push('kk'); return m; }

function startBattle(L, kind) {
  audio(); touchStreak();
  let ids, hp, name, mon;
  if (kind === 'boss') {
    const pool = ALL_FIDS.filter(id => !LEVEL_OF[id].groupMode);
    const weak = shuffle(pool.filter(id => !mastered(id))), strong = shuffle(pool.filter(mastered));
    ids = shuffle([...S.review.filter(id => pool.includes(id)), ...weak, ...strong].filter((v, i, a) => a.indexOf(v) === i).slice(0, D.boss.hp));
    hp = ids.length; name = D.boss.monster.name; mon = D.boss.monster;
  } else if (kind === 'review') {
    ids = shuffle(S.review.slice()); hp = ids.length; name = 'Bayang Lupa'; mon = { sprite: 'ghost', hue: 230 };
  } else { ids = shuffle(L.facts.map(f => f.id)); hp = ids.length; name = L.monster.name; mon = L.monster; }
  if (!ids.length) return toast('这里没有要复习的 fakta');
  B = { L, kind, queue: ids, total: ids.length, hp, maxHp: hp, hearts: 3, maxHearts: 3, combo: 0, maxCombo: 0, correct: 0, wrong: 0, covered: new Set(), skipped: [],
    flags: { shield: false, guard: false, double: 0 }, xp: 0, newM: [], missed: new Set(), orderDone: !(L && L.ordered), q: null, mon, name, busy: false, timer: null, tLeft: 0, half: false, used: 0 };
  const bt = $('#battle'); bt.hidden = false; document.body.style.overflow = 'hidden';
  renderBattle(); nextQ();
}
function renderBattle() {

function updBattle() {

  c.innerHTML = B.combo >= 2 ? `<b>${B.combo}×</b><span>COMBO · XP ×${mult().toFixed(1)}</span>` : '';
  const fl = []; if (B.flags.shield) fl.push('护盾'); if (B.flags.guard) fl.push('连击守护'); if (B.flags.double) fl.push(`双倍 ×${B.flags.double}`);

const mult = () => 1 + Math.min(B.combo, 10) * .1;

/* tray */
function usable(id) {
  const q = B.q; if (!q || B.busy) return false;
  switch (id) {
    case 'heal': return B.hearts < B.maxHearts;
    case 'iron': return true;
    case 'shield': return !B.flags.shield;
    case 'guard': return !B.flags.guard;
    case 'double': return !B.flags.double;
    case 'hint': return q.type === 'type' && !q.hint;
    case 'fifty': return q.type === 'mcq' && !q.fifty && q.options.length > 2;
    case 'peek': return ['mcq', 'type'].includes(q.type) && !q.peek;
    case 'smash': return B.hp > 0;
    case 'freeze': return B.kind === 'boss' && !!B.timer;
  } return false;
}
function renderTray() {
  const keys = 'QWERTY';

    ${B.kind === 'level' ? `<div class="bigstars">${[1, 2, 3].map((k, i) => IC.star(stars >= k).replace('<svg', `<svg style="animation-delay:${i * .15}s"`)).join('')}</div>` : ''}
    <div class="stat3"><div><b>+${Math.round(B.xp)}</b><span>XP（含过关奖励 ${bonus}）</span></div><div><b>${acc}%</b><span>正确率</span></div><div><b>${B.maxCombo}</b><span>最高连击</span></div></div>
    ${B.newM.length ? `<div class="small"><b style="color:var(--emerald)">新掌握 ${B.newM.length} 个 fakta：</b>${B.newM.map(id => esc(FACTS[id].f)).join('、')}</div>` : ''}
    ${B.skipped.length ? `<div class="small" style="color:var(--epic)">${B.skipped.length} 个 fakta 被重击跳过，已放进复习清单（拿不到 3 星）。</div>` : ''}
    ${B.kind === 'level' && stars < 3 ? `<div class="small muted">3 星条件：零失误，而且没有用重击跳题。</div>` : ''}
    <div class="btns"><button class="btn" id="toDraft">选一张道具卡</button></div>`;
  $('#tray').innerHTML = ''; $('#trayhint').textContent = '';
  $('#toDraft').onclick = () => draft(acc);
  $('#toDraft').focus({ preventScroll: true });
}
function draft(acc) {
  const rp = acc >= 90 && B.maxCombo >= 5 ? { epic: .2, rare: .45 } : acc >= 75 ? { epic: .08, rare: .35 } : { epic: .03, rare: .25 };
  const byR = r => Object.keys(CARDS).filter(k => CARDS[k].rar === r);
  const choices = []; while (choices.length < 3) { const r = Math.random(), rar = r < rp.epic ? 'epic' : r < rp.epic + rp.rare ? 'rare' : 'common'; const id = pick(byR(rar)); if (!choices.includes(id)) choices.push(id); }
  $('#qbox').innerHTML = `<div class="pix" style="font-size:22px;color:var(--gold);text-align:center">选一张道具卡</div>
    <div class="small muted" style="text-align:center">正确率 ${acc}% · ${acc >= 90 && B.maxCombo >= 5 ? '表现很好，稀有卡机率提高了' : '正确率和连击越高，越容易出稀有卡'}</div>
    <div class="draft">${choices.map((id, i) => { const c = CARDS[id]; return `<button class="dcard ${c.rar}" data-c="${id}" aria-label="${esc(c.zh + '：' + c.desc)}"><span class="face back">${CARD_ICON.hint.replace(/#ffd166/g, '#33406e')}</span><span class="face front"><span class="rar" style="color:var(--${c.rar === 'epic' ? 'epic' : c.rar === 'rare' ? 'violet' : 'sky'})">${RAR_ZH[c.rar]}</span>${CARD_ICON[id]}<b>${c.zh}</b><small>${esc(c.desc)}</small></span></button>`; }).join('')}</div>
    <div class="small muted" style="text-align:center">道具栏 ${S.inventory.length}/${INV_MAX}</div>
    <div class="btns" style="justify-content:center"><button class="btn ghost" id="skipDraft">不拿，回地图</button></div>`;
  const cards = $$('.dcard'); cards.forEach((c, i) => setTimeout(() => { c.classList.add('flip'); SFX.card(); }, 250 + i * 220));
  cards.forEach(c => c.onclick = () => {
    const id = c.dataset.c;
    if (S.inventory.length >= INV_MAX) return replaceCard(id);
    S.inventory.push(id); SFX.heal(); save(); toast(`获得 ${CARDS[id].zh}`); closeBattle();
  });
  $('#skipDraft').onclick = closeBattle;
}
function replaceCard(id) {
  modal(`<h3>道具栏满了</h3><p class="muted small">选一张丢掉，换成「${CARDS[id].zh}」。</p><div class="tray" style="flex-wrap:wrap">${S.inventory.map((c, i) => `<button class="pcard ${CARDS[c].rar}" data-i="${i}">${CARD_ICON[c]}<span>${CARDS[c].zh}</span></button>`).join('')}</div><div class="btns"><button class="btn ghost" data-close>算了</button></div>`, box => {
    $$('.pcard', box).forEach(b => b.onclick = () => { S.inventory.splice(+b.dataset.i, 1, id); save(); closeModal(); toast(`获得 ${CARDS[id].zh}`); closeBattle(); });
  });
}
async function defeat() {
  if (!B || B.ended) return; B.ended = true; clearTimer(); SFX.lose(); checkBadges(); save(); pushBoard();
  await sleep(RM ? 50 : 500);
  $('#qbox').innerHTML = `<div class="pix" style="font-size:26px;color:var(--ruby);text-align:center">KALAH…</div>
    <p class="small" style="text-align:center;margin:0">心用完了。这场的 <b style="color:var(--gold)">+${Math.round(B.xp)} XP</b> 和掌握进度都保留。</p>
    <div class="small"><b>这几个 fakta 要再看一次：</b></div>
    <div class="facts-list">${[...B.missed].map(id => `<div><b>${esc(FACTS[id].f)}</b><span class="small muted">${esc(FACTS[id].h)}</span></div>`).join('') || '<div class="small muted">—</div>'}</div>
    <div class="btns"><button class="btn" id="retry">再挑战</button><button class="btn ghost" id="back">回地图</button></div>`;
  $('#tray').innerHTML = ''; $('#trayhint').textContent = '';
  const L = B.L, kind = B.kind;
  $('#retry').onclick = () => { closeBattle(); startBattle(L, kind); };
  $('#back').onclick = closeBattle; $('#retry').focus({ preventScroll: true });
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if ($('#modal')) { if (e.key === 'Escape' && !$('#modal').dataset.lock) closeModal(); return; }
  if (!B) return;
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (e.key === 'Escape') return fleeAsk();
  if (e.key === 'Enter' && B.busy && $('#nextBtn')) { e.preventDefault(); return goNext(); }
  if (typing) return;
  if (B.q && B.q.type === 'mcq' && !B.busy && /^[1-4]$/.test(e.key)) { const o = $$('#qbox .opt')[+e.key - 1]; if (o && !o.disabled) answerMcq(+e.key - 1); }
  const k = 'qwerty'.indexOf(e.key.toLowerCase()); if (k > -1 && S.inventory[k]) useCard(k);
});
addEventListener('pointerdown', () => { if (S.settings.bgm && !bgmTimer) bgm(true); }, { once: true });

/* ---------- boot ---------- */
renderAll();
if (!S.onboarded) onboarding();
if (new Date().getHours() >= 23) { S.stats.owl = 1; setTimeout(() => { checkBadges(); save(); }, 1500); }
initCloud();
})();

</script>
<script type="module">
/* Firebase adapter for Fakta Quest (standalone website). Loaded as an ES module.
   Data layout (shared by every Bab / Sem game in this Firebase project):
   players/{uid}            -> { name, avatar, games: { <gameKey>: {xp,lvl,mastered,total,stars} }, xpTotal, at }   (leaderboard, readable by signed-in players)
   saves/{uid}/games/{key}  -> { state, xp, at }                                                                  (private save, only the owner) */
const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
(async () => {
  try {
    const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = initializeApp(window.FQ_FIREBASE_CONFIG), auth = A.getAuth(app), db = F.getFirestore(app);
    let myDoc = null;
    const uid = () => auth.currentUser.uid;
    const ad = {
      kind: 'firebase',
      onAuth(cb) { A.onAuthStateChanged(auth, u => { myDoc = null; cb(u ? { uid: u.uid, label: u.email || u.displayName || '' } : null); }); },
      signInGoogle() { return A.signInWithPopup(auth, new A.GoogleAuthProvider()); },
      signInEmail(e, p) { return A.signInWithEmailAndPassword(auth, e, p); },
      registerEmail(e, p) { return A.createUserWithEmailAndPassword(auth, e, p); },
      resetPassword(e) { return A.sendPasswordResetEmail(auth, e); },
      signOut() { return A.signOut(auth); },
      async loadSave(key) { const s = await F.getDoc(F.doc(db, 'saves', uid(), 'games', key)); return s.exists() ? s.data() : null; },
      writeSave(key, state, xp) { return F.setDoc(F.doc(db, 'saves', uid(), 'games', key), { state, xp: Math.round(xp), at: Date.now() }); },
      async pushPlayer(key, row) {
        const ref = F.doc(db, 'players', uid());
        if (!myDoc) { const s = await F.getDoc(ref); myDoc = s.exists() ? s.data() : { games: {} }; }
        const games = Object.assign({}, myDoc.games || {});
        games[key] = { xp: row.xp, lvl: row.lvl, mastered: row.mastered, total: row.total, stars: row.stars };
        const xpTotal = Object.values(games).reduce((a, g) => a + (g.xp | 0), 0);
        const body = { name: row.name, avatar: row.avatar | 0, games, xpTotal, at: Date.now() };
        await F.setDoc(ref, body); myDoc = body;
      },
      subscribeBoard(key, scope, cb, err) {
        const col = F.collection(db, 'players');
        const q = scope === 'all' ? F.query(col, F.orderBy('xpTotal', 'desc'), F.limit(50)) : F.query(col, F.orderBy(`games.${key}.xp`, 'desc'), F.limit(50));
        return F.onSnapshot(q, s => cb(s.docs.map(d => { const x = d.data(), g = (x.games || {})[key] || {};
          return scope === 'all' ? { id: d.id, name: x.name, avatar: x.avatar, xp: x.xpTotal | 0, sub: `全部章节 · 玩过 ${Object.keys(x.games || {}).length} 章` }
            : { id: d.id, name: x.name, avatar: x.avatar, xp: g.xp | 0, lvl: g.lvl, mastered: g.mastered, total: g.total, stars: g.stars }; })), err);
      }
    };
    window.FQ_FIREBASE = ad; dispatchEvent(new CustomEvent('fq-firebase', { detail: ad }));
  } catch (e) {
    console.warn('Firebase unavailable', e); window.FQ_FIREBASE = null; dispatchEvent(new CustomEvent('fq-firebase', { detail: null }));
  }
})();

</script>
